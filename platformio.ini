; Escape game "Explorer 3" (crash sur Mars) pour Cardputer ADV.
; WebSockets : flux de l'écran et du son vers le navigateur (mode avec écran).

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
	-DESP32S3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	m5stack/M5Cardputer @ ^1.1.1
	m5stack/M5Unified @ ^0.2.11
	m5stack/M5GFX @ ^0.2.17
	links2004/WebSockets @ ^2.6.1

; Simulateur PC (voir sim/LISEZMOI.md) : le jeu dans une fenêtre, avec le vrai
; M5GFX. Demande gcc et SDL2 de MSYS2 (UCRT64) dans le PATH. pio run -e simulateur
[env:simulateur]
platform = native
build_src_filter = +<main.cpp> +<../sim/*.cpp>
build_flags =
	-std=gnu++17
	-Isim/include
	-DM5GFX_BOARD=board_M5Cardputer
	-DM5GFX_SCALE=3
	-lSDL2
lib_deps =
	m5stack/M5GFX @ ^0.2.17
lib_compat_mode = off
